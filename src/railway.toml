[deploy]
preDeployCommand = "if [ \"$SEED_ON_DEPLOY\" = \"true\" ]; then php artisan migrate:fresh --seed --force; else php artisan migrate --force; fi && if [ \"$ADMIN_SEED_ON_DEPLOY\" = \"true\" ]; then php artisan db:seed --class=Database\\\\Seeders\\\\AdminUserSeeder --force; fi"
startCommand = "php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[build]
buildCommand = "COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction && npm ci --cache /tmp/.npm --no-audit --no-fund && npm run build && php artisan config:cache"
